<!DOCTYPE html>
<html>
<head>
    <title>Simple HTML Calculator</title>
</head>
<body>

<h2>Simple Calculator (HTML Only)</h2>

<form>
    <input type="text" placeholder="Enter first number"><br><br>
    
    <input type="text" placeholder="Enter second number"><br><br>
    
    <select>
        <option>Add (+)</option>
        <option>Subtract (-)</option>
        <option>Multiply (*)</option>
        <option>Divide (/)</option>
    </select><br><br>
    
    <button type="button">Calculate</button>
</form>

<p>Result will appear here (in theory).</p>

</body>
</html>
